# Valores de FABRICA do gh3.exe.
#
# Este ficheiro NAO e o que o jogo le em cada arranque. O 2-BUILD.bat copia-o
# para junto do exe como gh3.default.toml, e o Gh3App::OnConfigurePaths usa-o
# apenas para semear as definicoes do utilizador na primeira execucao:
#
#   config/gh3.toml  --(build)-->  out/build/.../gh3.default.toml
#                                        |
#                                        | (so se ainda nao existir)
#                                        v
#                              Documentos\gh3\gh3.toml   <- LIDO E GRAVADO
#
# E ai que o botao "Save to config" do menu F4 escreve, e por isso as tuas
# definicoes sobrevivem a rebuilds. Antes nao sobreviviam: o jogo lia de
# exe_dir/gh3.toml, que o build sobrescrevia a cada vez.
#
# Para repor tudo de fabrica: apaga Documentos\gh3\gh3.toml e reabre o jogo.
# Para mudar os valores de fabrica: edita este ficheiro (e apaga o do
# utilizador, senao continua a mandar o que ja esta gravado).
#
# TECLAS DE OVERLAY (registadas pelo SDK, e uma nossa):
#   F3   estatisticas de debug
#   F4   MENU DE DEFINICOES (so rato -- ver nota do F9 mais abaixo)
#   F7   achievements
#   F9   liga/desliga o teclado-como-comando, libertando o rato  <- nossa
#   `    consola; aceita "<cvar> <valor>", ex.: mnk_mode false

# O 0.9.0 tirou a emulacao de GPU do runtime e po-la num plugin carregavel.
# Sem isto, todas as chamadas de kernel Vd* sao ignoradas
# ("no GPU emulation loaded (gpu_plugin not set)"), o ring buffer nunca
# inicializa e o jogo rebenta na inicializacao grafica.
# Renderizador Nativo Vulkan Directo (Fase 2 - 60 FPS sin emulacion de CPU)
sa2_renderer_native = true
# Escala de render: 720p nativo 1:1 (1280x720, nitido sin distorsion de post-procesado ni blur)
sa2_render_height_handheld = 720
sa2_render_height_docked = 720
sa2_gpu_boost = true
sa2_shader_misses = "shader_misses"
sa2_native_logical_resolved_size = false

# Modo Performance Oficial (Fondo Negro / Sin Escenario 3D):
# 0 (o false): Desactivado (por defecto, renderiza el escenario 3D completo).
# 1 (o true): Activado (fondo negro solido estilo Guitar Hero 3 PC / Clone Hero a 60 FPS clavados).
# Tambien puedes configurarlo colocando un archivo llamado 'config' junto al .nro con un 1 o un 0.
gh3_performance_mode = true

# Optimizaciones CPU y Ring Thread (60 FPS)
sa2_cpu_enhancements = true
sa2_noncpu_enhancements = true
switch_profile_stacks = false
kernel_critsec_spin = 3072
sa2_native_flat_identity = true
sa2_native_fast_pair = true
sa2_native_raw_microcode = true
sa2_native_pm4_fast = true
sa2_native_compare_fast = true
sa2_native_fast_copy = true
sa2_native_upload_memory = 1
sa2_native_deferred_recording = false
sa2_deferred_native_fast = false
sa2_deferred_native_batch = 16
sa2_deferred_native_update = false
sa2_native_deferred_worker_core = -1
switch_exclusive_core = 0
sa2_cpu_main_thread_priority = true
sa2_main_thread_priority = 46
sa2_native_fingerprint_mode = 2
sa2_native_indices_cache = true
sa2_native_pipelines_prewarm = true
sa2_native_texture_interval_max = 256
sa2_native_fingerprints_kb_frame = 256
sa2_native_dedupe_max_fingerprint = 1
thread_signal_skip_idle = true
sa2_native_slots_work = 3
# EDRAM mode 4 activo con filtro nativo (elimina 8900+ pases color->depth sin romper depth->color para iluminacion del fondo)
sa2_native_edram_alias_mode = 4
sa2_native_edram4_stencil_enable = false
sa2_native_edram4_stencil_inert = true
sa2_native_edram4_stencil_lazy = true
sa2_native_edram4_stencil_copy = false
sa2_native_edram4_fast = true
sa2_native_conversion_frag = true
sa2_native_force_1x_msaa = true
sa2_native_edram4_clear_color0 = true
sa2_native_depth_samples_x = false
sa2_native_resolved_read_texels = 0
sa2_native_zcull_1x_depth = true
sa2_native_batch_resolve_barriers = true
sa2_native_reuse_alloc_resolved = true
sa2_gpu_marks_categories = false
sa2_native_precise_marks = false
sa2_native_reads_each = 8

# Fallback si sa2_renderer_native fuese false
gpu_plugin = "xenos"

# Escala nativa 1x (720p nativo; evita el default de 2x que renderizaba a 1440p)
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1

# Compilacion y presentacion de shaders sin descartar frames
async_shader_compilation = false
vulkan_async_skip_incomplete_frames = false
store_shaders = true

# Sincronizacion Presenter Vulkan: semaforos en GPU y modo IMMEDIATE (triple buffer no bloqueante en Horizon, sin stutter FIFO)
present_wait_acquisition_in_cpu = false
vulkan_allow_present_mode_immediate = true
vulkan_allow_present_mode_fifo_relaxed = true
# VSync relajado: evita congelamiento de VBlank en Horizon
sa2_vsync_relaxed = true

# Optimizaciones Tegra X1
anisotropic_override = 1
occlusion_query_enable = false

# I/O y Streaming de Audio (Elimina micro-tirones y congelamientos en la pista de notas)
sa2_io_window_kb = 2048        # Ventana de lectura anticipada de 2 MB (permite requests de 128 KB de audio)
sa2_io_windows_max = 16
sa2_io_ranges_min_kb = 64      # Piso de cache reducido a 64 KB para almacenar bloques de 128 KB
sa2_io_ranges_mb = 128         # Cap de cache en RAM elevado a 128 MB
audio_maxqframes = 32          # Capacidad de semaforo de audio (170 ms capacidad maxima)
audio_switch_frames_in_queue = 16  # Frames encolados en Switch antes de audout (85 ms cushion sin underruns)
audio_switch_pump = true

log_verbose = false
log_level = "info"

fullscreen = true
window_width = 1280
window_height = 720
# vsync = true fija la cadencia del vblank guest a 60 Hz (16.66 ms) para que el highway y el audio no se desincronicen
vsync = true

# En Switch mnk_mode (teclado de PC) debe estar apagado para que el gamepad/Joy-Con funcione
mnk_mode = false
mnk_user_index = 0

# Trastes ao estilo Clone Hero / Frets on Fire: 1..5 da esquerda para a direita.
# O mapeamento traste->botao segue o esquema do GH3 em comando normal.
keybind_a = "1"               # verde   (e "confirmar" nos menus)
keybind_b = "2"               # vermelho (e "voltar" nos menus)
keybind_y = "3"               # amarelo
keybind_x = "4"               # azul
keybind_left_shoulder = "5"   # laranja

# Palheta e navegacao. Ficam nos valores de fabrica, que ja servem:
#   Cima/Baixo = palhetar e mover no menu
#   Esquerda/Direita = mover no menu
keybind_dpad_up = "Up"
keybind_dpad_down = "Down"
keybind_dpad_left = "Left"
keybind_dpad_right = "Right"

keybind_start = "Return"      # Start: avancar ecras e pausar
keybind_back = "Tab"          # Back/Select

# Atencao: ao pôr o A no "1", o Space deixa de confirmar nos menus. Se algum
# ecra nao reagir, tenta 1, Return e as setas antes de assumir que esta preso.
#
# Todas estas chaves sao cvars do SDK; podes mexer-lhes sem recompilar nada,
# basta reabrir o jogo.

# ---------------------------------------------------------------------------
# CORES DO MENU DE DEFINICOES (so no ramo 081)
# ---------------------------------------------------------------------------
# O menu vem com o esquema afinado para o Skate 3: lima, magenta e paineis
# verde-azulado. Estes cvars trocam-no por uma paleta
# de PRETO, BRANCO e DOURADO: paineis pretos translucidos, linhas brancas
# (inalteradas) e dourado nos destaques.
#
# Formato RRGGBB ou RRGGBBAA (os dois ultimos digitos sao a transparencia; os
# paineis usam-na para deixar ver o jogo por tras).
#
# Ficarem VAZIOS repoe o esquema original -- e e por isso que o Skate 3, que
# nao os define, continua exatamente com o aspeto de antes.
ui_theme_accent = "D4A72C"    # laranja de chama: barras e anel de foco
ui_theme_accent_dark = "0A0A0A"    # texto sobre o laranja
ui_theme_interact = "C9992E"    # vermelho: setas e controlos
ui_theme_interact_hover = "F0CE5A"    # vermelho claro sob o rato
ui_theme_rail = "0A0A0AC8"  # barra de categorias, castanho escuro
ui_theme_rail_hover = "1F1F1FD9"  # a mesma, realcada
ui_theme_desc = "0A0A0AC8"  # painel de descricao

# ---------------------------------------------------------------------------
# FSR (so no ramo 081, e so se o build apontar para os headers do FidelityFX)
# ---------------------------------------------------------------------------
# O reescalador do rexglue ja estava implementado; faltava compilar com o SDK
# da AMD. Sem isso o unico valor aceite e "bilinear".
#
# Modos: bilinear | cas | fsr | fsr2 | fsr3
#   fsr  = EASU espacial. E o que interessa aqui: renderiza a Render Scale
#          (720p) e sobe para a Output Resolution com qualidade muito acima do
#          bilinear. Arestas de alto contraste -- a autoestrada de notas -- e
#          exatamente onde o EASU brilha.
#   cas  = so nitidez, sem reescalar.
#   fsr2/fsr3 = temporais. NAO recomendados aqui: um jogo do 360 emulado nao
#          fornece motion vectors nem depth reais, o SDK sintetiza-os e avisa
#          que pode cair de volta para o espacial. Num jogo de ritmo isso
#          arrisca artefactos nas notas, que e o que estas a olhar.
#
# ATENCAO: todos estes cvars sao kRequiresRestart -- mudar exige reabrir o jogo.
present_effect = "bilinear"
present_letterbox = false
present_safe_area_x = 100
present_safe_area_y = 100
present_allow_overscan_cutoff = false

# ---------------------------------------------------------------------------
# MODS
# ---------------------------------------------------------------------------
# Pasta de mods, aplicada por cima dos dados do jogo (cada subpasta e uma
# camada). Presente em TODAS as builds -- ate a base aplica mods de dados.
mods_root = 'C:/Users/Luis/Desktop/GUITAR HERO 3 RECOMP/mods'
# mods_allow_xex fica de FORA aqui de proposito: so a variante recompilada de um
# mod (build-081-dx e as do GH3 Mod Recompiler) o liga, porque so essa pode
# servir o xex do mod sem crashar. O launcher escolhe a build certa por hash.
